name: LLM Preflight
description: Run local no-spend LLM integration checks before a model, prompt, or provider change.
author: Fero Novak
branding:
  icon: check-circle
  color: purple

inputs:
  config:
    description: Path to the benchmark configuration.
    required: false
    default: benchmark.json
  package-version:
    description: Exact llm-preflight package version to install.
    required: false
    default: "2.13.0"
  run-paid:
    description: Run the bounded paid smoke after no-spend checks. Requires an explicit true value and caller-provided credentials.
    required: false
    default: "false"
  env-file:
    description: Optional environment file path for a paid smoke. Keep credentials in GitHub Secrets, not this repository.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.13"
    - name: Install LLM Preflight
      shell: bash
      run: python -m pip install "llm-preflight==${{ inputs.package-version }}"
    - name: Run no-spend preflight checks
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        llm-preflight "$CONFIG" --doctor --json
        llm-preflight "$CONFIG" --pricing-check
        llm-preflight "$CONFIG" --smoke --dry-run --json
    - name: Run explicitly authorized paid smoke
      if: ${{ inputs.run-paid == 'true' }}
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        ENV_FILE: ${{ inputs.env-file }}
      run: |
        set -euo pipefail
        args=("$CONFIG" --smoke --json --no-save)
        if [ -n "$ENV_FILE" ]; then
          args+=(--env-file "$ENV_FILE")
        fi
        llm-preflight "${args[@]}"

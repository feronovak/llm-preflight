name: LLM Preflight
description: Run local no-spend LLM integration checks before a model, prompt, or provider change.
author: Fero Novak
branding:
  icon: check-circle
  color: purple

inputs:
  config:
    description: Path to the benchmark configuration.
    required: false
    default: benchmark.json
  package-version:
    description: Exact llm-preflight package version to install.
    required: false
    default: "2.16.0"
  run-paid:
    description: Run the bounded paid smoke after no-spend checks. Requires an explicit true value and caller-provided credentials.
    required: false
    default: "false"
  env-file:
    description: Optional environment file path for a paid smoke. Keep credentials in GitHub Secrets, not this repository.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.13"
    - name: Install LLM Preflight
      shell: bash
      env:
        PACKAGE_VERSION: ${{ inputs.package-version }}
      run: |
        set -euo pipefail
        version="$PACKAGE_VERSION"
        for attempt in 1 2 3 4 5 6; do
          if python -m pip install "llm-preflight==${version}"; then
            exit 0
          fi
          sleep 20
        done
        echo "PyPI does not yet serve llm-preflight==${version}" >&2
        exit 1
    - name: Run no-spend preflight checks
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        llm-preflight "$CONFIG" --doctor --json
        llm-preflight "$CONFIG" --pricing-check
        llm-preflight "$CONFIG" --smoke --dry-run --json
        {
          echo "## LLM Preflight — no-spend checks"
          echo
          echo "Configuration doctor, pricing coverage, and bounded smoke planning completed."
          echo "No generation requests were made by the default checks."
          echo
          echo 'A live smoke remains opt-in through run-paid: "true".'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Run explicitly authorized paid smoke
      if: ${{ inputs.run-paid == 'true' }}
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        ENV_FILE: ${{ inputs.env-file }}
      run: |
        set -euo pipefail
        args=("$CONFIG" --smoke --json --no-save)
        if [ -n "$ENV_FILE" ]; then
          args+=(--env-file "$ENV_FILE")
        fi
        result_file="$(mktemp)"
        trap 'rm -f "$result_file"' EXIT
        set +e
        llm-preflight "${args[@]}" > "$result_file"
        status=$?
        set -e
        PYTHONPATH="$GITHUB_ACTION_PATH${PYTHONPATH:+:$PYTHONPATH}" \
          python -m llm_preflight report "$result_file" --format markdown \
          >> "$GITHUB_STEP_SUMMARY"
        exit "$status"

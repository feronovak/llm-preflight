name: LLM Preflight
description: Run local no-spend LLM integration checks before a model, prompt, or provider change.
author: Fero Novak
branding:
  icon: check-circle
  color: purple

inputs:
  config:
    description: Path to the benchmark configuration.
    required: false
    default: benchmark.json
  package-version:
    description: Exact llm-preflight package version to install.
    required: false
    default: "2.21.2"
  run-paid:
    description: Run the bounded paid smoke after no-spend checks. Requires an explicit true value and caller-provided credentials.
    required: false
    default: "false"
  env-file:
    description: Optional environment file path for a paid smoke. Keep credentials in GitHub Secrets, not this repository.
    required: false
    default: ""
  attest:
    description: After the paid smoke, write a proof-of-preflight record of its result and an SVG card, and upload both as the llm-preflight-record artifact. Requires run-paid "true". The result itself, which holds the prompts, is not uploaded.
    required: false
    default: "false"
  sign:
    description: 'Also sign the record with actions/attest, so gh attestation verify can check where it came from. Requires attest "true" and, in the calling job, the permissions id-token: write and attestations: write. Available for public repositories, and for private ones on GitHub Enterprise Cloud.'
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Check proof-of-preflight inputs
      if: ${{ inputs.attest == 'true' || inputs.sign == 'true' }}
      shell: bash
      env:
        RUN_PAID: ${{ inputs.run-paid }}
        ATTEST: ${{ inputs.attest }}
      run: |
        set -euo pipefail
        if [ "$RUN_PAID" != "true" ]; then
          echo 'attest and sign need run-paid: "true"; without a paid smoke there is no result to record' >&2
          exit 1
        fi
        if [ "$ATTEST" != "true" ]; then
          echo 'sign needs attest: "true"; it signs the record that attest writes' >&2
          exit 1
        fi
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.13"
    - name: Install LLM Preflight
      shell: bash
      env:
        PACKAGE_VERSION: ${{ inputs.package-version }}
      run: |
        set -euo pipefail
        version="$PACKAGE_VERSION"
        for attempt in 1 2 3 4 5 6; do
          if python -m pip install "llm-preflight==${version}"; then
            exit 0
          fi
          sleep 20
        done
        echo "PyPI does not yet serve llm-preflight==${version}" >&2
        exit 1
    - name: Run no-spend preflight checks
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        llm-preflight "$CONFIG" --doctor --json
        llm-preflight "$CONFIG" --pricing-check
        llm-preflight "$CONFIG" --smoke --dry-run --json
        {
          echo "## LLM Preflight — no-spend checks"
          echo
          echo "Configuration doctor, pricing coverage, and bounded smoke planning completed."
          echo "No generation requests were made by the default checks."
          echo
          echo 'A live smoke remains opt-in through run-paid: "true".'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Run explicitly authorized paid smoke
      id: paid
      if: ${{ inputs.run-paid == 'true' }}
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        ENV_FILE: ${{ inputs.env-file }}
        ATTEST: ${{ inputs.attest }}
        SIGN: ${{ inputs.sign }}
      run: |
        set -euo pipefail
        args=("$CONFIG" --smoke --json --no-save)
        if [ -n "$ENV_FILE" ]; then
          args+=(--env-file "$ENV_FILE")
        fi
        result_file="$(mktemp)"
        trap 'rm -f "$result_file"' EXIT
        set +e
        llm-preflight "${args[@]}" > "$result_file"
        status=$?
        set -e
        PYTHONPATH="$GITHUB_ACTION_PATH${PYTHONPATH:+:$PYTHONPATH}" \
          python -m llm_preflight report "$result_file" --format markdown \
          >> "$GITHUB_STEP_SUMMARY"
        if [ "$ATTEST" = "true" ]; then
          # The record names the result by its file name. The named copy is
          # removed with the result; neither is uploaded.
          result_dir="$(mktemp -d)"
          trap 'rm -f "$result_file"; rm -rf "$result_dir"' EXIT
          result="$result_dir/llm-preflight-result.json"
          cp "$result_file" "$result"
          record_dir="$RUNNER_TEMP/llm-preflight-record"
          record="$record_dir/llm-preflight-result.preflight.json"
          mkdir -p "$record_dir"
          export PYTHONPATH="$GITHUB_ACTION_PATH${PYTHONPATH:+:$PYTHONPATH}"
          python -m llm_preflight attest "$result" --config "$CONFIG" --output "$record"
          python -m llm_preflight report "$result" --format svg --record "$record" \
            --output "$record_dir/llm-preflight-card.svg"
          echo "record=$record" >> "$GITHUB_OUTPUT"
          echo "record-dir=$record_dir" >> "$GITHUB_OUTPUT"
          if [ "$SIGN" = "true" ]; then
            # actions/attest wraps the predicate in its own signed statement.
            predicate="$RUNNER_TEMP/llm-preflight-predicate.json"
            python -c 'import json, sys; json.dump(json.load(open(sys.argv[1]))["predicate"], open(sys.argv[2], "w"))' \
              "$record" "$predicate"
            echo "predicate=$predicate" >> "$GITHUB_OUTPUT"
          fi
        fi
        exit "$status"
    - name: Upload the preflight record
      id: record
      if: ${{ !cancelled() && steps.paid.outputs.record != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: llm-preflight-record
        path: ${{ steps.paid.outputs.record-dir }}
        if-no-files-found: error
    - name: Link the preflight record in the job summary
      if: ${{ !cancelled() && steps.record.outputs.artifact-url != '' }}
      shell: bash
      env:
        ARTIFACT_URL: ${{ steps.record.outputs.artifact-url }}
      run: |
        set -euo pipefail
        {
          echo
          echo "Preflight record and card: [llm-preflight-record]($ARTIFACT_URL)"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Sign the preflight record
      if: ${{ !cancelled() && inputs.sign == 'true' && steps.paid.outputs.predicate != '' }}
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-path: ${{ steps.paid.outputs.record }}
        predicate-type: https://in-toto.io/attestation/test-result/v0.1
        predicate-path: ${{ steps.paid.outputs.predicate }}
